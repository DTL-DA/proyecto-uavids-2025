# Integración continua del Entregable 3: pruebas unitarias del modelo original y del dashboard en cada push.
name: Entregable 3 · pruebas
on:
  push:
    paths: ["Entregable_3_UAVIDS_2025/**", ".github/workflows/entregable3-pruebas.yml"]
  pull_request:
    paths: ["Entregable_3_UAVIDS_2025/**"]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Entregable_3_UAVIDS_2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.6.0 pytest==6.2.5
      - name: Pruebas
        run: python -m pytest tests
